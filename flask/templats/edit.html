{% extends 'base.html' %}

{% block title %}Edit Task #{{ todo.id }} | Flask App{% endblock %}

{% block content %}
<header class="app-header">
    <div class="header-title">
        <h1>✏️ Edit Task</h1>
        <p class="subtitle">Modify task details and update your list</p>
    </div>
</header>

<section class="card form-card">
    <form action="{{ url_for('edit', id=todo.id) }}" method="POST" class="todo-form">
        <div class="form-group">
            <label for="title" class="form-label">Task Title</label>
            <input 
                type="text" 
                id="title"
                name="title" 
                value="{{ todo.title }}"
                required 
                autocomplete="off"
                class="form-control"
            >
        </div>
        <div class="form-group">
            <label for="description" class="form-label">Description (Optional)</label>
            <textarea 
                id="description"
                name="description" 
                rows="4" 
                class="form-control"
            >{{ todo.description or '' }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
